observation_sources_string: lidar
observation_sources:
  - lidar
observation_sources_dict:
  lidar:
    topic: ${namespace}/laser_scan
    sensor_frame: ${frame}lidar_frame
    max_obstacle_height: 2.0
    clearing: true
    marking: true
    data_type: "LaserScan"

robot_base_frame: 'base_footprint'
robot_odom_frame: 'odom'
robot_sensor_frame: 'lidar_frame'
robot_model: Ai2_Bot2
robot_radius: 0.28

footprint: "[ [0.29, 0.28], [0.29, -0.28], [-0.29, -0.28], [-0.29, 0.28] ]"

is_holonomic: false

z_offset: 0.0

# speed override
max_vel_x: 0.4
max_vel_theta: 0.8
max_speed_xy: 0.4
velocity_smoother_max_velocity: [0.4, 0.0, 0.8]
velocity_smoother_min_velocity: [-0.4, 0.0, -0.8]
velocity_smoother_max_accel: [0.5, 0.0, 0.5]
velocity_smoother_max_decel: [-0.5, 0.0, -0.5]

sensor_frame_transforms:
  - parent: base_footprint
    child: lidar_frame
    x: 0.261
    y: 0.0
    z: 0.1265
    qx: 0.0
    qy: 0.0
    qz: 0.70711
    qw: 0.70711