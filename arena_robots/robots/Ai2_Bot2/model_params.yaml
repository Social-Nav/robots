observation_sources_string: lidar
observation_sources:
  - lidar
observation_sources_dict:
  lidar:
    topic: ${namespace}/laser_scan
    max_obstacle_height: 2.0
    clearing: true
    marking: true
    data_type: "LaserScan"

robot_base_frame: 'base_footprint'
robot_odom_frame: 'odom'
robot_sensor_frame: 'lidar_link'
robot_model: Ai2_Bot2
robot_radius: 0.3

footprint: "[ [0.25, 0.25], [0.25, -0.25], [-0.25, -0.25], [-0.25, 0.25] ]"

is_holonomic: false

laser:
  angle:
    increment: 0.00654497222
    max: 2.35619
    min: -2.35619
  num_beams: 720
  range: 30.0
  update_rate: 10

z_offset: 0.0
