# Local costmap sources. The rear camera is global-only because its cloud is delayed.
observation_sources_string: lidar depth_pcl
observation_sources:
  - lidar
  - depth_pcl
# Global costmap sources, including the rear camera.
observation_sources_string_global: lidar depth_pcl back_depth_pcl
# Collision monitor uses LiDAR only; the disabled polygon makes it a cmd_vel relay.
# Keep depth_pcl in both costmaps: the LiDAR is a low single-plane sensor.
collision_monitor_sources:
  - lidar
observation_sources_dict:
  lidar:
    topic: ${namespace}/laser_scan
    sensor_frame: ${frame}lidar_frame
    max_obstacle_height: 2.0
    clearing: true
    marking: true
    data_type: "LaserScan"
# Clearing must reach beyond the marking range to remove stale obstacles.
    raytrace_max_range: 8.0
    raytrace_min_range: 0.0
    obstacle_max_range: 2.0
    obstacle_min_range: 0.0
    observation_persistence: 0.0   # keep only the latest scan; do not accumulate history
  depth_pcl:
    # Topic: <robot_ns>/chassis_camera/depth_pcl.
    # Known render latency is about 1.75 s. This is a timestamp delay, not a frame offset;
    # TF still projects the cloud using its original simulation timestamp.
    # Keep only the newest cloud and use simulation-time stamps.
    topic: ${namespace}/chassis_camera/depth_pcl
    sensor_frame: ${frame}chassis_camera
    max_obstacle_height: 1.5
    min_obstacle_height: 0.1
    clearing: true
    marking: true
    data_type: "PointCloud2"
    type: pointcloud
    # Clear farther than the marking range so stale pedestrian cells are removed.
    raytrace_max_range: 8.0
    raytrace_min_range: 0.0
    obstacle_max_range: 2.0
    obstacle_min_range: 0.0
    observation_persistence: 0.0   # keep only the latest cloud; do not accumulate history
  back_depth_pcl:
    # Rear camera point cloud.
    topic: ${namespace}/back_camera/depth_pcl
    sensor_frame: ${frame}back_camera
    max_obstacle_height: 1.5
    min_obstacle_height: 0.1
    clearing: true
    marking: true
    data_type: "PointCloud2"
    type: pointcloud
    # Clear farther than the marking range so stale obstacle cells are removed.
    raytrace_max_range: 8.0
    raytrace_min_range: 0.0
    obstacle_max_range: 2.0
    obstacle_min_range: 0.0
    observation_persistence: 0.0   # keep only the latest cloud; do not accumulate history

robot_base_frame: 'base_link'
robot_odom_frame: 'odom'
robot_sensor_frame: 'lidar_frame'
robot_model: Ai2_Bot2
# USD redirect to arena_robots/deps/robot_usds submodules
usd_redirect: ../../../deps/robot_usds/humanoid/Ai2_Bot2/Ai2_Bot2.usda
robot_radius: 0.48

# Uniform model scale. Applied to the USD root, sensor TFs, footprint, radius, and z offset.
scale: 0.8

# Full USD XY envelope before scaling. Arena scales this polygon at launch.
footprint: "[ [0.3209, 0.3813], [0.3209, -0.3813], [-0.3306, -0.3813], [-0.3306, 0.3813] ]"

is_holonomic: false

z_offset: 0.0

# Speed limits for non-social controllers and the final velocity smoother.
# Social MPC uses its profile/scenario speed target and the caps below.
max_vel_x: 0.4
max_vel_theta: 1.5
max_speed_xy: 0.4
# The lower of the MPC and smoother caps is binding.
velocity_smoother_max_velocity: [0.8, 0.0, 1.5]
velocity_smoother_min_velocity: [0.0, 0.0, -1.5]   # No reverse; angular velocity is bidirectional.
velocity_smoother_max_accel: [0.5, 0.0, 2.0]
velocity_smoother_max_decel: [-0.5, 0.0, -2.0]

sensor_frame_transforms:
  - parent: base_link
    child: lidar_frame
    x: 0.261
    y: 0.0
    z: 0.1265
    qx: 0.0
    qy: 0.0
    qz: 0.70711
    qw: 0.70711
  - parent: base_link
    child: chassis_camera
    x: 0.315
    y: 0.0
    z: 0.104
    qx: -0.5
    qy: 0.5
    qz: -0.5
    qw: 0.5
  - parent: base_link
    child: back_camera
    # Calibrated ROS optical frame: points backward and about 18 degrees downward.
    x: 0.0233
    y: 0.0
    z: 1.4245
    qx: -0.572063
    qy: -0.572065
    qz: 0.415624
    qw: 0.415623

# Isaac Sim data logging paths. Full prim path:
# /World/Robots/<robot_stage_name>/<suffix>.
data_logger:
  robot_stage_name: Ai2_Bot2
  camera_prim_suffix: head_link2/head_camera/d435/head_camera
  lidar_prim_suffix: Ai2_Bot2_Chassis/base_footprint/base_link/lidar_link
  pedestrian_root_path: /World/Pedestrians

# Snapshot camera paths used after proactive yielding pauses the simulation.
# Head/back cameras capture RGB+depth; topdown captures RGB only.
snapshot:
  head_camera_suffix: head_link2/head_camera/d435/head_camera
  back_camera_suffix: body_link4/back_camera/d435/back_camera
  topdown_half_extent: 3.0    # Half-width of the top-down view (m).
  topdown_height: 3.0         # Top-down camera height (m).
